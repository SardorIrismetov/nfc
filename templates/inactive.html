<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Карточка не активирована</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<body class="bg-gray-50 flex items-center justify-center h-screen m-0">
    <div class="bg-white p-10 rounded-2xl shadow-sm text-center max-w-sm w-full mx-4 border border-gray-100">

            </svg>
        </div>

        <p class="text-gray-500 text-sm mb-8">Если вы владелец, зайдите в панель управления, чтобы настроить ссылку.</p>
        <button disabled class="w-full bg-gray-200 text-gray-500 font-semibold py-3 px-4 rounded-xl cursor-not-allowed transition-colors">
            Перейти к отзывам
        </button>
    </div>
